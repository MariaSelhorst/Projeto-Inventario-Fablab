<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabLab - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="login-box">
        <h1>🔬 FabLab</h1>
        <h2>Criar Conta</h2>
        
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" id="usuario" placeholder="Escolha um usuário">
        </div>
        
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha">
        </div>
        
        <button onclick="register()" class="btn-login">Cadastrar</button>
        
        <p class="info-text">
            Já tem conta? <a href="login.html">Fazer login</a>
        </p>
        
        <div id="mensagem" class="mensagem"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
